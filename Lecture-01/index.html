<!DOCTYPE html>
<html>
    <body>
        <h1>What Can JavaScript Do?</h1>
        <p>JavaScript can change HTML attribute values.</p>
        <p>
        In this case JavaScript change the value of the src (source) attribute of an image.
        </p>
        <button onclick="document.getElementById('myImage').src='/Lecture-01/picture/pic_bulbon.gif'">Turn on the light</button>
        <img id="myImage" src="/Lecture-01/picture/pic_bulboff.gif" width="100px"> <!รูปเริ่มต้นหน้า Webpage>
        <button onclick="document.getElementById('myImage').src='/Lecture-01/picture/pic_bulboff.gif'">Turn off the light</button>
    </body>
</html>
